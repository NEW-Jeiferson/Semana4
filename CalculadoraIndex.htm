<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Quisqueya Payroll - Registro</title>
  <link rel="stylesheet" href="assets/styless.css">
</head>
<body>
  <div class="container">
    <h1>🇩🇴 Quisqueya Payroll - Registrar Empleado</h1>

    <form id="formEmpleado">
      <div class="campo">
        <label>Nombre completo</label>
        <input type="text" id="nombre" placeholder="Ej: Maria Perez">
        <span class="err" id="errNombre"></span>
      </div>

      <div class="campo">
        <label>Cedula</label>
        <input type="text" id="cedula" placeholder="402-1234567-8">
        <span class="err" id="errCedula"></span>
      </div>

      <div class="campo">
        <label>Email</label>
        <input type="email" id="email" placeholder="maria@empresa.com">
        <span class="err" id="errEmail"></span>
      </div>

      <div class="campo">
        <label>Telefono</label>
        <input type="text" id="telefono" placeholder="809-555-1234">
        <span class="err" id="errTelefono"></span>
      </div>

      <div class="campo">
        <label>Salario bruto (RD$)</label>
        <input type="number" id="salario" placeholder="45000">
        <span class="err" id="errSalario"></span>
      </div>

      <div class="calc">
        <h3>Calculo automatico</h3>
        <div class="linea"><span>AFP (2.87%)</span><span id="resAFP">RD$ 0.00</span></div>
        <div class="linea"><span>SFS (3.04%)</span><span id="resSFS">RD$ 0.00</span></div>
        <div class="linea neto"><span>Neto a recibir</span><span id="resNeto">RD$ 0.00</span></div>
      </div>

      <button type="submit" id="btnGuardar">Guardar empleado</button>
    </form>

    <h2>Empleados registrados</h2>
    <table id="tablaEmpleados">
      <thead>
        <tr><th>Nombre</th><th>Cedula</th><th>Email</th><th>Salario</th><th>Neto</th></tr>
      </thead>
      <tbody id="tbodyEmpleados"></tbody>
    </table>
  </div>

  <script src="assets/app.js"></script>
</body>
</html>
